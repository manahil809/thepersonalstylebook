<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="My Personal Style Book">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Personal Style Book</title>
  <link rel="manifest" href="manifest.json">

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver,
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    let landmarker = null;

    async function getLandmarker() {
      if (landmarker) return landmarker;
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      landmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        },
        runningMode: "IMAGE",
        numFaces: 1,
      });
      return landmarker;
    }

    function dist(a, b, w, h) {
      const dx = (a.x - b.x) * w;
      const dy = (a.y - b.y) * h;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.detectFaceMeasurements = async function (dataUrl) {
      try {
        const img = new Image();
        img.src = dataUrl;
        await img.decode();

        const lm = await getLandmarker();
        const result = lm.detect(img);

        if (!result.faceLandmarks || result.faceLandmarks.length === 0) {
          return JSON.stringify({ error: "no_face" });
        }

        const p = result.faceLandmarks[0];
        const w = img.naturalWidth;
        const h = img.naturalHeight;

        return JSON.stringify({
          length: dist(p[10], p[152], w, h),
          cheek: dist(p[234], p[454], w, h),
          jaw: dist(p[172], p[397], w, h),
          forehead: dist(p[54], p[284], w, h),
        });
      } catch (e) {
        return JSON.stringify({ error: String(e) });
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
